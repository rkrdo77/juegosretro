<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartucho NFC Retro</title>
    <style>
        body { background-color: #121212; color: white; font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        h1 { color: #ffcc00; }
        .box { background: #1e1e1e; padding: 20px; border-radius: 10px; display: inline-block; margin-top: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        input { margin: 10px 0; padding: 10px; background: #333; color: white; border: 1px solid #555; border-radius: 5px; }
        button { background: #e50914; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #b20710; }
    </style>
</head>
<body>

    <h1>🎮 Consola NFC Retro</h1>
    <p>Inserta tu cartucho o selecciona el juego para comenzar.</p>

    <div class="box">
        <h3>Cargar ROM de juego</h3>
        <input type="file" id="romFile" accept=".nes,.smc,.sfc"><br>
        <button onclick="alert('Selecciona tu archivo ROM arriba y cárgalo en tu emulador preferido.')">Iniciar Juego</button>
    </div>

</body>
</html>
